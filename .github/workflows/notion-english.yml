name: Update English Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-english-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: |
          mkdir -p data

          python3 <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["NOTION_TOKEN"]
          data_source_id = os.environ["DATA_SOURCE_ID"]

          url = f"https://api.notion.com/v1/data_sources/{data_source_id}/query"

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2025-09-03",
              "Content-Type": "application/json",
          }

          results = []
          cursor = None

          while True:
              body = {"page_size": 100}

              if cursor:
                  body["start_cursor"] = cursor

              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )

              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)

              results.extend(payload.get("results", []))

              if not payload.get("has_more"):
                  break

              cursor = payload.get("next_cursor")

          output = {
              "recordCount": len(results),
              "records": results
          }

          with open("data/english-data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Fetched {len(results)} English study records.")
          PY

      - name: Commit English data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/english-data.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update English study data"
            git push
          fi
