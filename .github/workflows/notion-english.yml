name: Update English Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  update-english-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and format Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: |
          mkdir -p data

          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime

          token = os.environ["NOTION_TOKEN"]
          data_source_id = os.environ["DATA_SOURCE_ID"]

          url = f"https://api.notion.com/v1/data_sources/{data_source_id}/query"

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2025-09-03",
              "Content-Type": "application/json",
          }

          raw_records = []
          cursor = None

          while True:
              body = {"page_size": 100}

              if cursor:
                  body["start_cursor"] = cursor

              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )

              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)

              raw_records.extend(payload.get("results", []))

              if not payload.get("has_more"):
                  break

              cursor = payload.get("next_cursor")

          def get_title(prop):
              items = prop.get("title", [])
              return "".join(x.get("plain_text", "") for x in items)

          def get_select(prop):
              value = prop.get("select")
              return value.get("name") if value else None

          def get_date(prop):
              value = prop.get("date")
              return value.get("start") if value else None

          def calculate_duration(start, end):
              if not start or not end:
                  return 0

              try:
                  start_dt = datetime.fromisoformat(start.replace("Z", "+00:00"))
                  end_dt = datetime.fromisoformat(end.replace("Z", "+00:00"))
                  return max(0, round((end_dt - start_dt).total_seconds() / 60))
              except Exception:
                  return 0

          records = []

          for page in raw_records:
              props = page.get("properties", {})

              session = get_title(props.get("Session", {}))
              practice_type = get_select(props.get("Practice Type", {}))
              date = get_date(props.get("Date", {}))
              start_time = get_date(props.get("Start Time", {}))
              end_time = get_date(props.get("End Time", {}))

              duration = calculate_duration(start_time, end_time)

              if date:
                  date = date[:10]

              records.append({
                  "date": date,
                  "practiceType": practice_type,
                  "duration": duration,
                  "session": session
              })

          records.sort(key=lambda x: x.get("date") or "")

          output = {
              "recordCount": len(records),
              "records": records
          }

          with open("data/english-data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Formatted {len(records)} English study records.")
          PY

      - name: Commit English data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/english-data.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update English study data"
            git push
          fi
